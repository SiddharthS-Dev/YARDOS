# SmartPark Enterprise - local development infrastructure.
#
# Brings up only the backing services. The API and web app run on the host via
# `npm run dev` for fast reload. For a fully containerised stack (used by CI and
# as the staging/production template) see docker-compose.full.yml.
#
# Non-default host ports are used deliberately so this stack never collides with
# a developer's pre-existing PostgreSQL/Redis installation. Override any of them
# via POSTGRES_PORT / REDIS_PORT / MINIO_PORT if they are already taken locally.

name: smartpark

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartpark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartpark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartpark_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-smartpark}
      # Deterministic collation so ORDER BY on registration numbers is stable
      # across developer machines and CI.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartpark} -d ${POSTGRES_DB:-smartpark}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: smartpark-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for ANPR captures, invoice PDFs and documents.
  minio:
    image: minio/minio:latest
    container_name: smartpark-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartpark}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartpark_dev_only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  # One-shot job that creates the buckets the API expects.
  minio-init:
    image: minio/mc:latest
    container_name: smartpark-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartpark}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartpark_dev_only}
      BUCKET: ${OBJECT_STORAGE_BUCKET:-smartpark-dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set none local/$$BUCKET &&
      echo 'bucket ready';
      "
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
